image:
  repository: ghcr.io/nthhuy202/be-elearning-platform
  # Tag bất biến theo commit SHA. Từ 5.3, CI sẽ tự sửa đúng dòng này —
  # nên nó phải là giá trị THẬT trong git, không còn để rỗng lấy appVersion.
  tag: 5073a780ee71c8785a25845a5c33ec58de5eeaf8
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    # Đo được ~8.6m lúc nhàn rỗi (Grafana, 20/08/2026). Đặt 25m để có dư
    # cho khởi động và tải nhẹ, vẫn thấp hơn 100m cũ 4 lần.
    cpu: 25m
    # Đo được ~66 MiB. Node.js heap phình dần trước khi GC nên để dư ~50%.
    memory: 128Mi
  limits:
    # Không đặt limits.cpu: CPU là compressible, chạm limit thì throttle
    # âm thầm chứ không chết -> triệu chứng mơ hồ.
    memory: 384Mi

ingress:
  # Rỗng = khớp mọi hostname (gõ localhost là vào).
  host: ''

# Key ở đây chính là tên biến môi trường, không dịch qua lại.
env:
  NODE_ENV: production
  PORT: '8080'
  JWT_EXPIRES_IN: 1h
  VNPAY_TMN_CODE: TESTTMN
  VNPAY_PAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  VNPAY_RETURN_URL: http://localhost/payments/vnpay/return

postgres:
  image: postgres:17-alpine
  storage: 2Gi
  # Không phải secret — dùng cho pg_isready ở readinessProbe và initContainer.
  # Mật khẩu nằm trong templates/sealed-secret-postgres.yaml.
  user: postgres
  database: elearning
  resources:
    requests:
      # Đo được 4.7m / 25.7 MiB lúc nhàn rỗi (Grafana, 20/08/2026).
      cpu: 25m
      memory: 128Mi
    limits:
      # Postgres đang nhẹ vì gần như không có dữ liệu. Nó sẽ ăn nhiều hơn
      # hẳn khi shared_buffers được dùng thật -> để dư rộng.
      memory: 512Mi
