image:
  repository: ghcr.io/nthhuy202/be-elearning-platform
  # Tag bất biến theo commit SHA. Từ 5.3, CI sẽ tự sửa đúng dòng này —
  # nên nó phải là giá trị THẬT trong git, không còn để rỗng lấy appVersion.
  tag: d9e3008aaec30ac3a3fe48d392fb2144bdf0e637
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

ingress:
  # Rỗng = khớp mọi hostname (gõ localhost là vào).
  host: ''

# Key ở đây chính là tên biến môi trường, không dịch qua lại.
env:
  NODE_ENV: production
  PORT: '8080'
  JWT_EXPIRES_IN: 1h
  VNPAY_TMN_CODE: TESTTMN
  VNPAY_PAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  VNPAY_RETURN_URL: http://localhost/payments/vnpay/return

# Vẫn là plaintext, y như Phase 3. Phase 5 chuyển sang Sealed Secrets.
# DATABASE_URL KHÔNG nằm ở đây — nó được ghép từ postgres.auth bên dưới.
secrets:
  JWT_SECRET: dev-secret-doi-o-phase-5
  VNPAY_HASH_SECRET: TESTHASHSECRET

postgres:
  image: postgres:17-alpine
  storage: 2Gi
  auth:
    user: postgres
    password: postgres
    database: elearning
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
