image:
  repository: ghcr.io/nthhuy202/be-elearning-platform
  # Tag bất biến theo commit SHA. Từ 5.3, CI sẽ tự sửa đúng dòng này —
  # nên nó phải là giá trị THẬT trong git, không còn để rỗng lấy appVersion.
  tag: 379b4c541cf59dcef4985d6fa7c31041de543543
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

ingress:
  # Rỗng = khớp mọi hostname (gõ localhost là vào).
  host: ''

# Key ở đây chính là tên biến môi trường, không dịch qua lại.
env:
  NODE_ENV: production
  PORT: '8080'
  JWT_EXPIRES_IN: 1h
  VNPAY_TMN_CODE: TESTTMN
  VNPAY_PAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  VNPAY_RETURN_URL: http://localhost/payments/vnpay/return

postgres:
  auth:

postgres:
  image: postgres:17-alpine
  storage: 2Gi
  # Không phải secret — dùng cho pg_isready ở readinessProbe và initContainer.
  # Mật khẩu nằm trong templates/sealed-secret-postgres.yaml.
  user: postgres
  database: elearning
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
