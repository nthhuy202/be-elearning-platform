apiVersion: v1
kind: ConfigMap
metadata:
  name: api
data:
  # `quote` bọc nháy cho MỌI value -> tự tránh bẫy "PORT: 8080 là số" ở 3.2.
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: api
type: Opaque
stringData:
  # Ghép từ postgres.auth thay vì chép tay: đổi mật khẩu DB ở một chỗ,
  # cả Postgres lẫn connection string của app cùng đổi theo.
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgres:5432/%s?schema=public"
                    .Values.postgres.auth.user
                    .Values.postgres.auth.password
                    .Values.postgres.auth.database | quote }}
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: {{ .Values.replicaCount }}

  # maxUnavailable: 0 = không bao giờ tụt dưới số replica sẵn sàng.
  # maxSurge: 1 = được phép dựng tạm một pod thừa trong lúc thay.
  # Đây mới là thứ làm nên "không downtime", không phải replicas.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Nợ lớn nhất của Phase 3 chết ở đây: tag định nghĩa đúng MỘT chỗ,
          # api và migrate job cùng đọc.
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          envFrom:
            - configMapRef:
                name: api
            - secretRef:
                name: api

          ports:
            - name: http
              containerPort: 8080

          # CỐ Ý không đặt limits.cpu: CPU là compressible resource, chạm
          # limit thì bị throttle (chậm dần, p99 xấu) chứ không chết —
          # triệu chứng mơ hồ, tốn hàng giờ mò.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # Lúc xoá pod, K8s gỡ khỏi Endpoints và gửi SIGTERM SONG SONG.
          # sleep 5 hoãn SIGTERM để Endpoints kịp lan tới ingress, tránh 502.
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '5']

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 10

          # Còn sống không? KHÔNG đụng DB — DB chết mà giết app là sai.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10

          # Nhận request được chưa? Có đụng DB (SELECT 1).
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: http