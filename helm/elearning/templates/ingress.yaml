apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  ingressClassName: nginx
  rules:
    # Không khai `host:` -> khớp mọi hostname, gõ localhost là vào.
    # Cần nhiều hostname thì dùng *.localtest.me (trỏ sẵn về 127.0.0.1).
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
