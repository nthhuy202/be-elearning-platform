# Mật khẩu dev cho cluster local, giống hệt docker-compose.yml.
# KHÔNG phải nơi để mật khẩu thật: Secret của K8s chỉ là base64, không mã hoá.
# Phase 5 (deploy thật) sẽ chuyển sang Sealed Secrets.
apiVersion: v1
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  # Headless: DNS trả thẳng IP pod, không qua ClusterIP ảo.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          envFrom:
            - secretRef:
                name: postgres
          env:
            # Postgres đòi thư mục data phải rỗng lúc initdb. Trên block storage
            # thật, volume mới mount vào luôn có sẵn lost+found -> initdb từ chối.
            # Đẩy data xuống thư mục con là hết chuyện.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', '{{ .Values.postgres.user }}', '-d', '{{ .Values.postgres.database }}']
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres']
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}

  # Mỗi replica được cấp PVC riêng, và PVC KHÔNG bị xoá khi pod chết.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage | quote }}
