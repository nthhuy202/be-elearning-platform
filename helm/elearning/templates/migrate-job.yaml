apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    # ArgoCD dịch pre-upgrade -> PreSync (chạy TRƯỚC mọi resource), và không
    # phân biệt install với upgrade như Helm. Để pre-upgrade ở đây thì lần
    # sync đầu Job chờ Postgres chưa tồn tại -> kẹt vĩnh viễn.
    # PostSync chạy sau khi mọi resource đã Healthy, đúng cho cả hai trường hợp.
    'argocd.argoproj.io/hook': PostSync
    'argocd.argoproj.io/hook-delete-policy': BeforeHookCreation

    # Helm (chạy tay) vẫn dùng annotation của nó — hai hệ thống đọc hai key
    # khác nhau nên khai cả hai là an toàn, không xung đột.
    'helm.sh/hook': post-install,pre-upgrade
    'helm.sh/hook-delete-policy': before-hook-creation

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      # Job có thể được tạo trước khi Postgres kịp sẵn sàng. Chờ ở đây
      # rẻ hơn nhiều so với để migration fail rồi dựa vào backoffLimit.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U {{ .Values.postgres.auth.user }}; do sleep 2; done

      containers:
        - name: migrate
          # Cùng image với app: migration nằm trong prisma/migrations của
          # chính commit đó. Dùng image khác là chạy nhầm phiên bản.
          image: {{ include "elearning.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['npx', 'prisma', 'migrate', 'deploy']
          envFrom:
            - secretRef:
                name: api
