name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push liên tiếp lên cùng 1 PR: huỷ run cũ, chỉ giữ run mới nhất.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mặc định GITHUB_TOKEN có quyền ghi. Siết về chỉ-đọc; job nào cần
# thêm thì tự khai ở cấp job (2.4 cần packages: write để push ghcr).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # generated/prisma nằm trong .gitignore nên trên CI nó không tồn tại.
      # Không sinh lại thì tsc và build sẽ không giải được 'generated/prisma/enums'.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elearning_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # prisma.config.ts nạp `.env`, không phải `.env.test`, nên phải truyền
      # DATABASE_URL tường minh cho bước migrate.
      - name: Migrate test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/elearning_test?schema=public

      - name: E2E tests
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: [check, e2e]

    # Nới quyền cho riêng job này; check và e2e vẫn chỉ-đọc.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PR từ fork không được cấp quyền ghi package, đăng nhập sẽ fail.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # PR chỉ build để biết Dockerfile còn dựng được; chỉ main mới push.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    runs-on: ubuntu-latest
    needs: docker
    # Chỉ chạy khi đã thực sự push image lên ghcr. PR không bump.
    # Bỏ qua chính commit do bot sinh ra, nếu không: PR bump merge -> push vào
    # main -> bump lại -> PR mới -> lặp vô hạn, cháy Actions minutes.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore: bump image tag')

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Bump image tag in values.yaml
        run: |
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" helm/elearning/values.yaml
          grep -A1 'repository:' helm/elearning/values.yaml

      - name: Commit, open PR and auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/elearning/values.yaml
          # Chạy lại workflow cũ thì sed không đổi gì -> thoát êm.
          git diff --staged --quiet && exit 0

          BRANCH="bump/${{ github.sha }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: bump image tag to ${{ github.sha }}"
          git push -u origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "chore: bump image tag to ${{ github.sha }}" \
            --body "Tự động sinh sau khi image đã lên ghcr. ArgoCD sẽ sync sau khi merge."

          gh pr merge "$BRANCH" --squash --auto --delete-branch
