name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push liên tiếp lên cùng 1 PR: huỷ run cũ, chỉ giữ run mới nhất.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mặc định GITHUB_TOKEN có quyền ghi. Siết về chỉ-đọc; job nào cần
# thêm thì tự khai ở cấp job (2.4 cần packages: write để push ghcr).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # generated/prisma nằm trong .gitignore nên trên CI nó không tồn tại.
      # Không sinh lại thì tsc và build sẽ không giải được 'generated/prisma/enums'.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elearning_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # prisma.config.ts nạp `.env`, không phải `.env.test`, nên phải truyền
      # DATABASE_URL tường minh cho bước migrate.
      - name: Migrate test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/elearning_test?schema=public

      - name: E2E tests
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: [check, e2e]

    steps:
      - uses: actions/checkout@v4

      # Driver mặc định không hỗ trợ cache exporter — thiếu bước này thì
      # cache-to bị bỏ qua mà không báo lỗi.
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: elearning-platform:${{ github.sha }}
          cache-from: type=gha
          # mode=max để cache cả layer của stage builder, không chỉ image cuối.
          cache-to: type=gha,mode=max
