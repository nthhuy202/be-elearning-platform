name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # generated/prisma nằm trong .gitignore nên trên CI nó không tồn tại.
      # Không sinh lại thì tsc và rated/prisma/enums'.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
