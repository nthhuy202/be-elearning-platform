apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  # Migration fail thường là fail thật (SQL sai), thử lại 10 lần vô nghĩa.
  backoffLimit: 3
  # Job xong tự dọn sau 10 phút, khỏi tích tụ pod Completed.
  ttlSecondsAfterFinished: 600

  template:
    spec:
      # Never: pod hỏng thì Job tạo pod MỚI, không restart pod cũ.
      # Giữ được log của lần chạy hỏng để đọc.
      restartPolicy: Never

      containers:
        - name: migrate
          # Cùng image với app: migration nằm trong prisma/migrations của chính
          # commit đó. Dùng image khác là nguy cơ chạy nhầm phiên bản migration.
          image: elearning-api:3.4
          imagePullPolicy: IfNotPresent
          command: ['npx', 'prisma', 'migrate', 'deploy']
          envFrom:
            # Chỉ cần DATABASE_URL, nhưng dùng chung Secret để khỏi lệch nhau.
            - secretRef:
                name: api
